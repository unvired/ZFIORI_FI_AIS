# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.wel.assetstandardcost
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: WDE
          
          client: "120"
        app:
          name: ZFIORI_FI_AIS
          package: ZFI_FIORI_AIS
          transport: WDEK914167
        exclude:
          - /test/
          - /localService/
